name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, frontmatter and skill-evals gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Lint frontmatter and manifests
        run: uv run --locked python tests/lint_frontmatter.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Lint Python
        run: uv run --locked ruff check .
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # code_metrics: los 26 hallazgos `high` son deuda real (funciones de 120-184 lineas,
      # V(G) 21-40) y estan aceptados en tests/metrics_baseline.json; el gate falla si crecen.
      # clone_detect: con los defaults (20 tokens) marca 803 clones de helpers de 5 lineas que
      # el empaquetado autocontenido por carpeta obliga a duplicar; aqui se exige ademas tamano
      # y similitud altos para que solo cuente la duplicacion sustancial.
      - name: Code metrics ratchet (no new high findings or clones)
        run: uv run --locked python tests/metrics_gate.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Design skill-evals cases
        run: uv run --locked python skill-evals/scripts/design.py --from-phrases tests/phrases.json --out skill-evals/reports/cases.json
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run skill-evals gates
        run: uv run --locked python skill-evals/scripts/run.py --cases skill-evals/reports/cases.json --out skill-evals/reports/run.json --fail-under precision=0.95 --fail-under recall=0.98 --fail-under mrr=0.98
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 = suelo declarado en requires-python (se verifica de verdad);
        # 3.14 = versión en fase bugfix. Antes solo se probaba 3.13, así que
        # el mínimo anunciado jamás se ejecutaba en CI.
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Run every test suite
        run: uv run --locked python run_tests.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run pytest from the repository root
        run: uv run --locked pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
