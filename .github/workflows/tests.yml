name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, frontmatter and skill-evals gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # la guardia de versiones compara contra el commit anterior

      # actionlint valida los workflows con las mismas reglas que GitHub al cargarlos:
      # un `matrix` en un `if` de job, por ejemplo, tumbaba tag-release.yml entero.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          line=$(grep -F "  ${tarball}" checksums.txt || true)
          if [ -z "$line" ]; then
            echo "::error::checksums.txt no lista ${tarball}"
            exit 1
          fi
          printf '%s\n' "$line" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate workflows with actionlint
        run: actionlint -color

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Version guard (package changes need a version bump)
        run: uv run --locked python tests/version_guard.py --base "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Lint frontmatter and manifests
        run: uv run --locked python tests/lint_frontmatter.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Lint Python
        run: uv run --locked ruff check .
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # code_metrics: el techo de hallazgos `high` vive en tests/metrics_baseline.json y hoy
      # es 0: cualquier funcion que duplique un limite (120 lineas, V(G) 20, anidamiento 8,
      # 12 parametros) rompe el gate en vez de engordar la deuda aceptada.
      # clone_detect: con los defaults (20 tokens) marca 803 clones de helpers de 5 lineas que
      # el empaquetado autocontenido por carpeta obliga a duplicar; aqui se exige ademas tamano
      # y similitud altos para que solo cuente la duplicacion sustancial.
      - name: Code metrics ratchet (no new high findings or clones)
        run: uv run --locked python tests/metrics_gate.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Design skill-evals cases
        run: uv run --locked python skill-evals/scripts/design.py --from-phrases tests/phrases.json --out skill-evals/reports/cases.json
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run skill-evals gates
        run: uv run --locked python skill-evals/scripts/run.py --cases skill-evals/reports/cases.json --out skill-evals/reports/run.json --fail-under precision=0.95 --fail-under recall=0.98 --fail-under mrr=0.98
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 = suelo declarado en requires-python (se verifica de verdad);
        # 3.14 = versión en fase bugfix. Antes solo se probaba 3.13, así que
        # el mínimo anunciado jamás se ejecutaba en CI.
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Run every test suite
        run: uv run --locked python run_tests.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run pytest from the repository root
        run: uv run --locked pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
