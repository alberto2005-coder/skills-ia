name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Frontmatter lint and ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Lint frontmatter and manifests
        run: uv run --locked python tests/lint_frontmatter.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Lint Python
        run: uv run --locked ruff check .
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Run every test suite
        run: uv run --locked python run_tests.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
