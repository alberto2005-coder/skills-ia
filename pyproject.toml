[project]
name = "skills-ia-tests"
version = "0.1.0"
description = "Entorno común para las suites de pruebas del repositorio"
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
# `importlib` evita que dos ficheros con el mismo basename (`test_structure.py`
# en tres suites, `test_report.py` en dos…) se resuelvan al mismo módulo.
addopts = "--import-mode=importlib"
testpaths = [
    "tests",
    "agent-red-team/tests",
    "api-contract-guard/tests",
    "appsec-audit/tests",
    "db-architect/tests",
    "docs-sync-engine/tests",
    "finops-auditor/tests",
    "humanizador-anti-ia/tests",
    "premium-web-designer/tests",
    "refactor-surgeon/tests",
    "replica/tests",
    "seo-auditor/tests",
    "skill-evals/tests",
]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [".venv", "**/tests/fixtures/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-json-report>=1.5,<2.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]
