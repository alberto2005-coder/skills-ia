[project]
name = "skills-ia-tests"
version = "0.1.0"
description = "Entorno común para las suites de pruebas del repositorio"
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [".venv", "**/tests/fixtures/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-json-report>=1.5,<2.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]
